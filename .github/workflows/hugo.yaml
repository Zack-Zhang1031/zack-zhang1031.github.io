name: Redirect to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy-redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create redirect page
        run: |
          mkdir -p ./redirect
          cat > ./redirect/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=https://zack-zhang1031.vercel.app/">
            <link rel="canonical" href="https://zack-zhang1031.vercel.app/">
            <title>正在跳转...</title>
            <style>
              body { margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
              a { color: #34d399; }
            </style>
          </head>
          <body>
            <div style="text-align: center;">
              <p>页面已迁移，正在跳转到新地址...</p>
              <p>如未自动跳转，请 <a href="https://zack-zhang1031.vercel.app/">点击这里</a></p>
            </div>
            <script>location.replace('https://zack-zhang1031.vercel.app/');</script>
          </body>
          </html>
          HTMLEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./redirect

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
